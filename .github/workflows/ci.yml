name: ci

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  pre-commit:
    uses: coatl-dev/workflows/.github/workflows/pre-commit.yml@31a6192d52b637a7363f8add40a3f709c98147da # v7.0.35
    with:
      skip-hooks: 'pylint'

  pylint:
    needs: pre-commit
    uses: coatl-dev/workflows/.github/workflows/pylint.yml@31a6192d52b637a7363f8add40a3f709c98147da # v7.0.35
    with:
      path: 'src'

  jython:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      JYTHON_CACHE_DIR: $HOME/.cache/jython
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Jython
        uses: coatl-dev/actions/setup-jython@499c77f2bc6f909d372849058517ca2e39ce16d4 # v7.1.3
        id: setup-jython
        with:
          jython-version: '2.7.3'

      - name: Cache Jython
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.JYTHON_CACHE_DIR }}
          key: jy-${{ steps.setup-jython.outputs.jython-version }}-${{ runner.os }}-${{ steps.setup-jython.outputs.java-distribution }}-${{ steps.setup-jython.outputs.java-version }}-${{ hashFiles('setup.py') }}

      - name: Test installation on Jython
        run: |
          make install JYTHON_CACHE_DIR=${{ env.JYTHON_CACHE_DIR }}

  tox-package:
    if: ${{ github.event_name == 'pull_request' }}
    uses: coatl-dev/workflows/.github/workflows/tox-docker.yml@31a6192d52b637a7363f8add40a3f709c98147da # v7.0.35

  tox-stubs:
    if: ${{ github.event_name == 'pull_request' }}
    uses: coatl-dev/workflows/.github/workflows/tox.yml@31a6192d52b637a7363f8add40a3f709c98147da # v7.0.35
    with:
      python-versions: |
        3.9
        3.10
        3.11
        3.12
      working-directory: stubs
